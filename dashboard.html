
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJCC Railways | Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f5f3ee;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #102044;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            font-size: 21px;
            letter-spacing: 2px;
        }

        .topbar span {
            color: #d18408;
        }

        .logout {
            background: #d18408;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .content {
            padding: 55px 7%;
        }

        .content h1 {
            color: #102044;
            margin-bottom: 10px;
        }

        .content > p {
            color: #77766f;
        }

        .role-label {
            display: inline-block;
            background: #e9dfc9;
            color: #173963;
            padding: 9px 17px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 12px;
            font-weight: bold;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .dash-card {
            background: white;
            padding: 27px;
            border-radius: 10px;
            border: 1px solid #e2e0d9;
            transition: 0.3s;
            cursor: pointer;
        }

        .dash-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(16, 32, 68, 0.08);
        }

        .dash-card:focus {
            outline: 2px solid #d18408;
            outline-offset: 3px;
        }

        .dash-card h3 {
            color: #102044;
            margin-bottom: 12px;
        }

        .dash-card p {
            color: #77766f;
            font-size: 13px;
            line-height: 1.6;
        }

        .status-message {
            margin-top: 20px;
            color: #77766f;
        }

        .status-message.error {
            color: #dc2626;
        }

        @media(max-width: 600px) {
            .content {
                padding: 35px 20px;
            }

            .topbar {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h2>JJCC <span>RAILWAYS</span></h2>

    <button class="logout" id="logoutButton">
        SIGN OUT
    </button>
</header>

<main class="content">

    <h1 id="welcome">Welcome!</h1>

    <p id="description">Loading your dashboard...</p>

    <div class="role-label" id="roleLabel">
        LOADING...
    </div>

    <section class="dashboard-grid" id="dashboardCards"></section>

    <p class="status-message" id="statusMessage"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // =====================================
    // SUPABASE CONFIGURATION
    // =====================================

    const SUPABASE_URL =
        "https://ckykcejjmrcjcaiorikd.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_Tv7ZwN3fd9miokDU9CHcVA_MW5N4bKP";

    const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

    // =====================================
    // DASHBOARD CONTENT
    // =====================================

    const dashboards = {

        user: {
            description:
                "Manage your railway reservations and travel information.",

            cards: [
                ["Book a Ticket", "Reserve your next railway trip."],
                ["My Reservations", "View your booking information."],
                ["Train Schedules", "Check available train schedules."],
                ["My Profile", "Manage your account information."]
            ]
        },

        admin: {
            description:
                "Manage railway operations and passenger reservations.",

            cards: [
                ["Manage Reservations", "View and manage passenger bookings."],
                ["Passengers", "View registered passenger information."],
                ["Train Management", "Manage train information."],
                ["Schedules", "Manage train schedules and routes."]
            ]
        },

        super_admin: {
            description:
                "Manage and monitor the entire JJCC Railways system.",

            cards: [
                ["User Management", "Manage registered accounts."],
                ["Admin Management", "Manage administrator accounts."],
                ["Role Management", "Manage user access roles."],
                ["System Settings", "Manage system configurations."]
            ]
        }

    };

    // =====================================
    // LOAD DASHBOARD
    // =====================================

    async function loadDashboard() {

        const statusMessage =
            document.getElementById("statusMessage");

        try {

            statusMessage.textContent = "Checking login session...";

            // CHECK SESSION

            const { data: sessionData, error: sessionError } =
                await client.auth.getSession();

            if (sessionError) throw sessionError;

            const session = sessionData.session;

            if (!session) {
                window.location.replace("index.html");
                return;
            }

            // GET AUTHENTICATED USER

            const { data: authData, error: authError } =
                await client.auth.getUser();

            if (authError) throw authError;

            if (!authData.user) {
                await client.auth.signOut();
                window.location.replace("index.html");
                return;
            }

            // GET PROFILE

            const { data: profile, error: profileError } =
                await client
                    .from("profiles")
                    .select("id, full_name, role")
                    .eq("id", authData.user.id)
                    .maybeSingle();

            if (profileError) throw profileError;

            if (!profile) {
                statusMessage.textContent =
                    "Your profile was not found. Contact the administrator.";
                statusMessage.classList.add("error");
                return;
            }

            // CHECK ROLE

            const dashboard = dashboards[profile.role];

            if (!dashboard) {
                statusMessage.textContent =
                    "Invalid account role. Contact the administrator.";
                statusMessage.classList.add("error");
                return;
            }

            // DISPLAY USER INFORMATION

            document.getElementById("welcome").textContent =
                "Welcome, " + (profile.full_name || "User") + "!";

            document.getElementById("description").textContent =
                dashboard.description;

            document.getElementById("roleLabel").textContent =
                profile.role.replace("_", " ").toUpperCase();

            // DISPLAY CARDS

            const cardsContainer =
                document.getElementById("dashboardCards");

            cardsContainer.innerHTML = "";

            dashboard.cards.forEach(card => {

                const cardElement =
                    document.createElement("div");

                cardElement.className = "dash-card";
                cardElement.setAttribute("tabindex", "0");
                cardElement.setAttribute("role", "button");

                const title =
                    document.createElement("h3");

                title.textContent = card[0];

                const description =
                    document.createElement("p");

                description.textContent = card[1];

                cardElement.append(title, description);

                // CARD NAVIGATION

                function openCard() {

                    if (
                        profile.role === "super_admin" &&
                        card[0] === "Admin Management"
                    ) {
                        window.location.href =
                            "dashboard-superadmin.html";

                        return;
                    }

                    statusMessage.textContent =
                        card[0] + " page is not yet connected.";

                    statusMessage.classList.remove("error");
                }

                cardElement.addEventListener("click", openCard);

                cardElement.addEventListener("keydown", event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {
                        event.preventDefault();
                        openCard();
                    }

                });

                cardsContainer.appendChild(cardElement);

            });

            statusMessage.textContent = "";

        } catch (error) {

            console.error("DASHBOARD ERROR:", error);

            statusMessage.textContent =
                "Dashboard error: " + error.message;

            statusMessage.classList.add("error");

        }

    }

    // =====================================
    // SIGN OUT
    // =====================================

    document.getElementById("logoutButton")
        .addEventListener("click", async function () {

            this.disabled = true;
            this.textContent = "SIGNING OUT...";

            const { error } =
                await client.auth.signOut();

            if (error) {

                alert(error.message);

                this.disabled = false;
                this.textContent = "SIGN OUT";

                return;
            }

            window.location.replace("index.html");

        });

    // =====================================
    // INITIALIZE
    // =====================================

    loadDashboard();

</script>

</body>
</html>
