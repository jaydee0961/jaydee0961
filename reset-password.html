
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | JJCC Railways</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #102044;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #f5f3ee;
            padding: 40px;
            border-radius: 12px;
        }

        h1 {
            color: #102044;
            margin-bottom: 8px;
        }

        p {
            color: #77766f;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #172440;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #c9c8c4;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #173963;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .success {
            color: green;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Set Your Password</h1>
        <p>Welcome to JJCC Railways! Create a password for your Admin account.</p>

        <form id="passwordForm">
            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                required
            >

            <button type="submit" id="submitButton">
                SET PASSWORD
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL =
            "https://ckykcejjmrcjcaiorikd.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Tv7ZwN3fd9miokDU9CHcVA_MW5N4bKP";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    detectSessionInUrl: false
                }
            }
        );

        const message = document.getElementById("message");
        const form = document.getElementById("passwordForm");
        const submitButton = document.getElementById("submitButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        async function verifyInvitation() {
            try {
                const url = new URL(window.location.href);
                const code = url.searchParams.get("code");

                // Handle PKCE invitation callback
                if (code) {
                    const { error } =
                        await supabaseClient.auth.exchangeCodeForSession(code);

                    if (error) throw error;

                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );
                }

                // Handle token-based invitation callback
                const hashParams = new URLSearchParams(
                    window.location.hash.substring(1)
                );

                const accessToken = hashParams.get("access_token");
                const refreshToken = hashParams.get("refresh_token");

                if (accessToken && refreshToken) {
                    const { error } =
                        await supabaseClient.auth.setSession({
                            access_token: accessToken,
                            refresh_token: refreshToken
                        });

                    if (error) throw error;

                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );
                }

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) throw error;

                if (!data.session) {
                    throw new Error(
                        "Invitation session not found. Please open the latest invitation link from your email."
                    );
                }

                showMessage(
                    "Invitation verified! You can now create your password.",
                    "success"
                );

            } catch (error) {
                console.error(error);

                form.style.display = "none";

                showMessage(
                    error.message || "Unable to verify invitation.",
                    "error"
                );
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "SAVING...";

            try {
                const { data: sessionData } =
                    await supabaseClient.auth.getSession();

                if (!sessionData.session) {
                    throw new Error(
                        "Your invitation session has expired. Please request a new invitation."
                    );
                }

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) throw error;

                showMessage(
                    "Password successfully created! Redirecting to login...",
                    "success"
                );

                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href = "./index.html";
                }, 2000);

            } catch (error) {
                console.error(error);

                showMessage(
                    error.message || "Unable to save password.",
                    "error"
                );

                submitButton.disabled = false;
                submitButton.textContent = "SET PASSWORD";
            }
        });

        verifyInvitation();
    </script>
</body>
</html>
